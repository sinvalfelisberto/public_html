<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página não encontrada - Erro 404</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 20px;
    }

    .container img {
      max-width: 250px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 3em;
      margin: 0;
      color: #ff6b6b;
    }

    p {
      font-size: 1.2em;
      margin: 15px 0 30px;
      color: #dcdcdc;
    }

    a {
      text-decoration: none;
      background: #ff6b6b;
      padding: 12px 24px;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    a:hover {
      background: #ff3b3b;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/2748/2748558.png" alt="Erro 404">
    <h1>Oops! Página não encontrada</h1>
    <p>A página que você procura pode ter sido removida, renomeada ou está temporariamente indisponível.</p>
    <a href="/">Voltar para a página inicial</a>
  </div>
</body>
</html>
